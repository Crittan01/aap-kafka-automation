---
# Inventario de recursos por pareja. El rol activo NO se declara aca: se descubre.
# Agregar Integrations (fase 4) es agregar un bloque, sin tocar codigo.

parejas:

  core:
    descripcion: "Kafka del core bancario (Temenos)"

    sitios:
      co:
        api: https://api.cluster-bvgj9.dyn.redhatworkshops.io:6443
        namespace: core-co
        kafka: bpd-kafka
      ca:
        api: https://api.cluster-75wqq.dyn.redhatworkshops.io:6443
        namespace: core-ca
        kafka: bpd-kafka

    # El MirrorMaker vive en el sitio destino de la replicacion.
    mirrormakers:
      co_ca:
        sitio: ca
        namespace: core-ca
        name: mirrormaker2-co-to-ca
      ca_co:
        sitio: co
        namespace: core-co
        name: mirrormaker2-ca-to-co

    # Kroxylicious. Un proxy por sitio; la operacion cambia targetKafkaServiceRef.
    proxy:
      co:
        namespace: core-co
        vkc: kafka-virtual-cluster
        destinos:
          co: kafka-co-srv
          ca: kafka-ca-srv
      ca:
        namespace: core-ca
        vkc: kafka-virtual-cluster
        destinos:
          co: kafka-co-srv
          ca: kafka-ca-srv

    # Lista explicita: la fase 2 borra topicos y no debe tocar los internos.
    topicos_aplicacion:
      - bpdtransactstreaming-event-topic

    grupos_consumo:
      - bpd-transact-consumer-group

    # Aplicaciones que siguen el rol del sitio. El productor queda fuera a
    # proposito: representa al core bancario, que conmuta por su cuenta.
    aplicaciones:
      co:
        - nombre: kafka-consumer-app
          namespace: core-co
          replicas: { activo: 1, pasivo: 0 }
      ca:
        - nombre: kafka-consumer-app
          namespace: core-ca
          replicas: { activo: 1, pasivo: 0 }
