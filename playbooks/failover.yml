---
# Failover de una pareja. Revalida antes de escribir: entre la aprobacion
# del operador y esta ejecucion pudo cambiar el estado.
#
# exigir_plan_aprobado declara si esta corrida viene de un workflow con
# aprobacion. El Job Template de AAP lo pone en true; suelto queda en false.
# Asi la diferencia de comportamiento es declarada, no inferida: si se espera
# un plan aprobado y no llega, falla en vez de saltearse en silencio.
#
# ansible-playbook playbooks/failover.yml -e pareja=core -e direccion=co_a_ca

- name: Ejecutar failover
  hosts: localhost
  gather_facts: false

  vars:
    exigir_plan_aprobado: false
    # Si el plan aprobado no tiene acciones no hay nada que descubrir ni
    # verificar. Descubrir cuesta una vuelta de consultas a los brokers, y no
    # hacer nada siempre es seguro: no hay estado que contrastar.
    nada_aprobado: "{{ wf_kafka_plan.nada_que_hacer | default(false) | bool }}"
    # El destino que el operador aprobo, y si ya se alcanzo. Se exige que la
    # direccion sea la misma que viajo con el plan: si difiere, el cableado del
    # workflow esta mal y eso si es un error.
    _fo_destino: "{{ kafka_plan.direccion | default('') | split('_a_') | last }}"
    _fo_destino_alcanzado: >-
      {{ (kafka_plan.nada_que_hacer | default(false) | bool)
         and wf_kafka_plan.direccion | default('') == kafka_plan.direccion | default('') }}

  tasks:
    - name: Informar que el plan aprobado no tiene nada que ejecutar
      ansible.builtin.debug:
        msg: >-
          El plan aprobado no tiene acciones: {{ wf_kafka_plan.sitio_a }} ya era
          el sitio activo solicitado. No se modifica nada.
      when: nada_aprobado | bool

    - name: Ejecutar la transicion aprobada
      when: not nada_aprobado | bool
      block:
        - name: Descubrir estado actual
          ansible.builtin.include_role:
            name: kafka_discover

        - name: Revalidar la transicion
          ansible.builtin.include_role:
            name: kafka_decide
          vars:
            modo: proponer

        - name: Exigir que el plan aprobado haya llegado
          ansible.builtin.assert:
            that: wf_kafka_plan is defined
            fail_msg: >-
              Se esperaba el plan aprobado del Job Template anterior y no llego.
              Revisar el cableado del workflow en AAP.
            quiet: true
          when: exigir_plan_aprobado | bool

        # El plan recalculado puede diferir del aprobado por dos razones muy
        # distintas, y solo una es un error. Si el destino que el operador pidio
        # ya es el sitio activo, su objetivo esta cumplido: no hay nada que
        # ejecutar y no hay nada que corregir. Cualquier otra divergencia si es
        # un error, porque significa que el ambiente quedo en un estado que
        # nadie aprobo.
        #
        # La rama benigna no puede alcanzarse con un estado a medio camino:
        # kafka_decide ya detuvo antes si el destino coincide pero el estado no
        # es coherente.
        - name: Informar que el destino aprobado ya estaba alcanzado
          ansible.builtin.debug:
            msg: >-
              Se aprobo dejar activo a {{ _fo_destino }}, y {{ kafka_estado.activo }}
              ya es el sitio activo con el estado coherente. No se modifico nada.
              El cambio ocurrio entre la aprobacion y esta ejecucion: si otra
              corrida ya hizo la operacion no queda nada pendiente, y si no,
              conviene revisar por que cambio.
          when:
            - exigir_plan_aprobado | bool
            - _fo_destino_alcanzado | bool

        - name: Comprobar que el plan sigue siendo el aprobado
          ansible.builtin.assert:
            that:
              - wf_kafka_plan.transicion == kafka_plan.transicion
              - wf_kafka_plan.sitio_a == kafka_plan.sitio_a
              - wf_kafka_plan.sitio_b == kafka_plan.sitio_b
            fail_msg: >-
              El estado cambio desde la aprobacion y el ambiente quedo en una
              situacion que nadie aprobo. No se modifico nada.
              Aprobado: {{ wf_kafka_plan.transicion }} {{ wf_kafka_plan.sitio_a }} -> {{ wf_kafka_plan.sitio_b }}.
              Encontrado: {{ kafka_plan.transicion }} {{ kafka_plan.sitio_a }} -> {{ kafka_plan.sitio_b }}.
              Revisar el estado antes de reintentar.
            success_msg: "El plan coincide con el aprobado"
          when:
            - exigir_plan_aprobado | bool
            - not _fo_destino_alcanzado | bool

        - name: Avisar que se corre sin aprobacion previa
          ansible.builtin.debug:
            msg: >-
              exigir_plan_aprobado=false: no se compara contra un plan aprobado.
              La transicion ya fue revalidada contra el estado actual.
          when: not exigir_plan_aprobado | bool

        # Suelto, sin plan aprobado, el descubrimiento de esta corrida pudo
        # concluir que ya se esta en el sitio solicitado.
        - name: Terminar si no hay acciones que ejecutar
          ansible.builtin.meta: end_play
          when: kafka_plan.nada_que_hacer | bool

        - name: Invertir MirrorMaker
          ansible.builtin.include_role:
            name: mm2_state

        - name: Conmutar proxy
          ansible.builtin.include_role:
            name: proxy_target

        - name: Escalar aplicaciones
          ansible.builtin.include_role:
            name: app_scale

        - name: Descubrir estado final
          ansible.builtin.include_role:
            name: kafka_discover

        - name: Verificar estado final
          ansible.builtin.include_role:
            name: kafka_decide
          vars:
            modo: verificar
