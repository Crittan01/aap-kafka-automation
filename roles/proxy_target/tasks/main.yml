---
# Conmuta el destino del proxy. Un patch de targetKafkaServiceRef.

- name: Validar que hay plan
  ansible.builtin.assert:
    that:
      - kafka_plan is defined
      - kafka_plan.acciones is defined
    fail_msg: "proxy_target requiere kafka_plan (lo produce kafka_decide)"
    quiet: true

- name: Resolver la conmutacion
  vars:
    _pt_acc: "{{ kafka_plan.acciones | selectattr('rol', 'eq', 'proxy_target') | first | default({}, true) }}"
  ansible.builtin.set_fact:
    _pt_hay_accion: "{{ _pt_acc | length > 0 }}"
    _pt_px: "{{ parejas[pareja].proxy[kafka_plan.sitio_a] }}"
    _pt_sitio: "{{ kafka_plan.sitio_a }}"
    _pt_destino: "{{ parejas[pareja].proxy[kafka_plan.sitio_a].destinos[kafka_plan.sitio_b] }}"

- name: Verificar el destino antes de conmutar
  ansible.builtin.include_tasks: precheck.yml
  when: _pt_hay_accion | bool

- name: Conmutar el proxy al KafkaService {{ _pt_destino }}
  kubernetes.core.k8s:
    api_version: "{{ api_versions.kroxylicious }}"
    kind: VirtualKafkaCluster
    name: "{{ _pt_px.vkc }}"
    namespace: "{{ _pt_px.namespace }}"
    state: patched
    definition:
      spec:
        targetKafkaServiceRef:
          name: "{{ _pt_destino }}"
    host: "{{ parejas[pareja].sitios[_pt_sitio].api }}"
    api_key: "{{ kafka_tokens[_pt_sitio] }}"
    validate_certs: "{{ kafka_validate_certs }}"
  when: _pt_hay_accion | bool

- name: Esperar que el proxy reconcilie
  kubernetes.core.k8s_info:
    api_version: "{{ api_versions.kroxylicious }}"
    kind: VirtualKafkaCluster
    name: "{{ _pt_px.vkc }}"
    namespace: "{{ _pt_px.namespace }}"
    host: "{{ parejas[pareja].sitios[_pt_sitio].api }}"
    api_key: "{{ kafka_tokens[_pt_sitio] }}"
    validate_certs: "{{ kafka_validate_certs }}"
  register: _pt_w
  until: >-
    ((_pt_w.resources | first).spec.targetKafkaServiceRef.name | default('')) == _pt_destino
    and ((_pt_w.resources | first).status.conditions | default([])
         | selectattr('type', 'eq', 'ResolvedRefs') | map(attribute='status')
         | first | default('')) == 'True'
  retries: "{{ (umbrales.proxy_ready_timeout / umbrales.proxy_ready_intervalo) | int }}"
  delay: "{{ umbrales.proxy_ready_intervalo }}"
  changed_when: false
  when:
    - _pt_hay_accion | bool
    - not ansible_check_mode
