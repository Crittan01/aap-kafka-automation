---
# Conmuta el destino de cada proxy que el plan nombre. Idempotente: es un
# patch de targetKafkaServiceRef.
#
# El plan puede nombrar mas de un proxy. El procedimiento operativo de BPD lo
# declara escenario por escenario en su resumen de URLs: el proxy apunta al
# Kafka del sitio activo, sea normal, failover o rotacion. Con un proxy por
# sitio eso son dos conmutaciones, la del sitio que sale y la del que llega.
# Antes el rol tomaba la primera accion y daba por hecho sitio_a -> sitio_b,
# asi que el proxy del sitio que llegaba se quedaba como estuviera.

- name: Conmutar cada proxy del plan
  ansible.builtin.include_tasks: conmutar.yml
  loop: "{{ kafka_plan.acciones | selectattr('rol', 'eq', 'proxy_target') | list }}"
  loop_control:
    loop_var: _pt_acc
    label: "{{ _pt_acc.sitio }} -> {{ _pt_acc.destino }}"
