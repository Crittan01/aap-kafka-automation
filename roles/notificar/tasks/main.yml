---
# Publica una tarjeta en Teams. Que el canal no conteste, o que la propia
# tarjeta este mal armada, no puede detener una operacion de contingencia:
# todo el rol va dentro de un rescue. failed_when no alcanza, porque un error
# al templar los argumentos ocurre antes de que se evalue.

- name: Publicar en Teams
  when: teams_webhook_url | length > 0
  block:

    - name: Armar el contenido de la tarjeta
      vars:
        _nt_al_dia: >-
          {{ kafka_estado.replicacion.offsets[kafka_estado.activo] | default({})
             == kafka_estado.replicacion.offsets[kafka_estado.pasivo] | default({}) }}
        _nt_nota_ok: >-
          {{ 'No se modifico nada.' if kafka_plan.nada_que_hacer | bool else
             'Se verificaron los datos: ninguna particion falta y los
              consumidores conservan su posicion.' }}
        _nt_mms: >-
          {{ (kafka_estado.mirrormakers | default({}) | dict2items
              | map(attribute='key') | zip(kafka_estado.mirrormakers | default({}) | dict2items
              | map(attribute='value.estado')) | map('join', '=') | list | join('  '))
             | default('no determinadas', true) }}
        _nt_titulo_prop: >-
          {{ 'Nada que hacer: ya se esta en el destino solicitado'
             if kafka_plan.nada_que_hacer | bool
             else 'Propuesta de ' ~ kafka_plan.operacion ~ ' — pendiente de aprobacion' }}
        _nt_nota_prop: >-
          {{ 'No se va a modificar nada. El estado es coherente.'
             if kafka_plan.nada_que_hacer | bool
             else 'Nada se modifico todavia. El flujo espera una decision.' }}
        _nt_variantes:
          propuesta:
            estado: "{{ _nt_titulo_prop }}"
            color: "{{ 'Accent' if kafka_plan.nada_que_hacer | bool else 'Warning' }}"
            hechos:
              - [Direccion, "dejar activo a {{ kafka_plan.direccion | split('_a_') | last }}"]
              - [Estado encontrado, "activo: {{ kafka_estado.activo }}   pasivo: {{ kafka_estado.pasivo }}"]
              - [Replicacion, "{{ 'al dia' if _nt_al_dia else 'CON ATRASO' }}"]
              - [Acciones, "{{ kafka_plan.acciones | length }} a aplicar"]
            nota: "{{ _nt_nota_prop }}"
          resultado:
            estado: "{{ 'Sin cambios: ya se estaba en el destino' if kafka_plan.nada_que_hacer | bool else 'Operacion completada y verificada' }}"
            color: Good
            hechos:
              - [Direccion, "{{ kafka_plan.sitio_a }} -> {{ kafka_plan.sitio_b }}"]
              - [Estado alcanzado, "activo: {{ kafka_estado.activo }}"]
              - [Acciones aplicadas, "{{ kafka_plan.acciones | length }}"]
            nota: "{{ _nt_nota_ok }}"
          fallo:
            estado: "La ejecucion se detuvo"
            color: Attention
            hechos:
              - [Fallo en, "{{ ansible_failed_task.name | default('(desconocida)') }}"]
              - [Motivo, "{{ (ansible_failed_result.msg | default('sin detalle')) | replace('\n', ' ') | truncate(200) }}"]
              - [Ambiente ahora, "activo: {{ kafka_estado.activo | default('no determinado') }}"]
              - [Replicaciones, "{{ _nt_mms }}"]
            nota: "Revisar el ambiente antes de reintentar."
      ansible.builtin.set_fact:
        _nt: "{{ _nt_variantes[tipo] }}"

    - name: Enviar la tarjeta
      ansible.builtin.uri:
        url: "{{ teams_webhook_url }}"
        method: POST
        body_format: json
        body: "{{ lookup('ansible.builtin.template', 'tarjeta.j2') }}"
        status_code: [200, 202]
        timeout: "{{ notificar_timeout }}"
      changed_when: false

  rescue:
    - name: Dejar constancia de que el aviso no salio
      ansible.builtin.debug:
        msg: >-
          No se pudo publicar la tarjeta '{{ tipo }}' en Teams.
          La operacion sigue: el canal no condiciona el procedimiento.
          Detalle: {{ ansible_failed_result.msg | default('sin detalle') | truncate(160) }}
