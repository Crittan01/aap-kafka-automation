---
argument_specs:
  main:
    short_description: Escala las aplicaciones de un sitio segun su rol
    description:
      - Patch idempotente de spec.replicas sobre los Deployment declarados.
      - El orden del plan importa, primero se baja el sitio que deja de ser activo.
    options:
      pareja:
        type: str
        required: true
        description: Clave de la pareja en parejas.yml
      kafka_plan:
        type: dict
        required: true
        description: Plan resuelto que produce kafka_decide en modo proponer
      kafka_tokens:
        type: dict
        required: true
        description: Token de API por sitio
      kafka_validate_certs:
        type: bool
        default: false
