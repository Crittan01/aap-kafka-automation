---
# Compara el estado descubierto contra el bloque 'hasta' de la transicion.

# Va primero: todo lo que sigue dereferencia kafka_plan, asi que si falta hay
# que decirlo con un mensaje util antes de que reviente con 'undefined'.
- name: Detener si falta el plan para verificar
  ansible.builtin.fail:
    msg: >-
      modo=verificar requiere kafka_plan, que produce kafka_decide en modo
      proponer. Revisar el orden de los roles en el playbook.
  when: kafka_plan is not defined

# Los sitios salen del plan, no del estado nuevo: despues de la operacion el
# activo cambio y re-derivarlos invertiria la expectativa.
- name: Recuperar sitios del plan aprobado
  ansible.builtin.set_fact:
    _dc_sa: "{{ kafka_plan.sitio_a }}"
    _dc_sb: "{{ kafka_plan.sitio_b }}"
    _dc_mm_hacia_b: "{{ kafka_plan.mm_hacia_b }}"
    _dc_mm_hacia_a: "{{ kafka_plan.mm_hacia_a }}"

- name: Verificar estado final
  vars:
    _dc_esp: "{{ _dc_t.hasta }}"
    _dc_esp_activo: "{{ _dc_sb if _dc_esp.activo == 'sitio_b' else _dc_sa }}"
  ansible.builtin.assert:
    that:
      - kafka_estado.activo == _dc_esp_activo
      - kafka_estado.mirrormakers[_dc_mm_hacia_b].estado == _dc_esp.mirrormakers.hacia_b
      - kafka_estado.mirrormakers[_dc_mm_hacia_a].estado == _dc_esp.mirrormakers.hacia_a
    fail_msg: |
      El estado final no coincide con el esperado por la transicion {{ _dc_t.id }}.
      activo        esperado={{ _dc_esp_activo }}  encontrado={{ kafka_estado.activo }}
      {{ _dc_mm_hacia_b }}  esperado={{ _dc_esp.mirrormakers.hacia_b }}  encontrado={{ kafka_estado.mirrormakers[_dc_mm_hacia_b].estado }}
      {{ _dc_mm_hacia_a }}  esperado={{ _dc_esp.mirrormakers.hacia_a }}  encontrado={{ kafka_estado.mirrormakers[_dc_mm_hacia_a].estado }}
    success_msg: "Estado final correcto: activo={{ kafka_estado.activo }}"

# Se exige de los dos proxies, no solo del que la transicion conmuta. Quien
# entra por cualquiera de los dos tiene que terminar en el sitio activo: es lo
# que declara el resumen de URLs del procedimiento operativo para cada
# escenario. Antes se exigia uno y del otro solo se avisaba, y asi una rotacion
# de ida y vuelta dejaba el proxy del sitio que volvia atendiendo contra el
# pasivo. La condicion se evalua solo si la transicion declara donde van.
- name: Verificar a donde lleva cada proxy
  vars:
    _dc_esp: "{{ _dc_t.hasta }}"
    _dc_esp_activo: "{{ _dc_sb if _dc_esp.activo == 'sitio_b' else _dc_sa }}"
    _dc_px_mal: >-
      {{ kafka_estado.sitios | dict2items
         | rejectattr('value.proxy_destino_sitio', 'eq', _dc_esp_activo)
         | map(attribute='key') | list }}
  ansible.builtin.assert:
    that:
      - _dc_px_mal | length == 0
    fail_msg: >-
      El proxy de {{ _dc_px_mal | join(' y el de ') }} no lleva al sitio activo
      {{ _dc_esp_activo }}: quien entre por ahi queda contra otro cluster.
      {% for s, d in kafka_estado.sitios.items() %}
      proxy {{ s }} -> {{ d.proxy_destino_sitio | default('?') }}
      {% endfor %}
    success_msg: >-
      Los dos proxies llevan al sitio activo {{ _dc_esp_activo }}
  when: _dc_esp.proxy_destino is defined

# El estado de configuracion no alcanza: hay que comprobar que los datos
# sobrevivieron y que los consumidores conservan su posicion.

- name: Verificar que no se perdieron mensajes
  vars:
    _dc_antes: "{{ kafka_plan.datos_previos.offsets | default({}) }}"
    _dc_ahora: "{{ kafka_estado.replicacion.offsets[_dc_sb] | default({}) }}"
    _dc_faltantes: >-
      {{ _dc_antes | dict2items
         | rejectattr('key', 'in', _dc_ahora.keys() | list) | map(attribute='key') | list }}
  ansible.builtin.assert:
    that:
      - _dc_faltantes | length == 0
    fail_msg: >-
      Faltan particiones en el sitio que asume: {{ _dc_faltantes | join(', ') }}
    success_msg: "Todas las particiones estan presentes en {{ _dc_sb }}"
  when: kafka_plan.datos_previos is defined

- name: Comprobar el recuento de mensajes por particion
  ansible.builtin.assert:
    that:
      - (kafka_estado.replicacion.offsets[_dc_sb][item.key] | default(-1) | int) >= (item.value | int)
    fail_msg: >-
      Se perdieron mensajes en {{ item.key }}:
      antes {{ item.value }}, ahora {{ kafka_estado.replicacion.offsets[_dc_sb][item.key] | default('ausente') }}
    success_msg: "{{ item.key }}: {{ item.value }} -> {{ kafka_estado.replicacion.offsets[_dc_sb][item.key] }}"
  loop: "{{ kafka_plan.datos_previos.offsets | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: kafka_plan.datos_previos is defined

- name: Comprobar que los consumidores conservan su posicion
  ansible.builtin.assert:
    that:
      - (kafka_estado.replicacion.grupos[_dc_sb][item.key] | default(-1) | int) >= (item.value | int)
    fail_msg: >-
      El grupo perdio su posicion en {{ item.key }}:
      antes {{ item.value }}, ahora {{ kafka_estado.replicacion.grupos[_dc_sb][item.key] | default('ausente') }}.
      Los consumidores reprocesarian desde el principio.
    success_msg: "{{ item.key }}: marcador {{ item.value }} conservado"
  loop: "{{ kafka_plan.datos_previos.grupos | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: kafka_plan.datos_previos is defined
