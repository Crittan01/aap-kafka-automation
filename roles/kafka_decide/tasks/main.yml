---
# Busca la transicion en el contrato, la resuelve a acciones concretas y
# decide si se puede avanzar. No escribe en los clusters.

- name: Cargar contrato de transiciones
  ansible.builtin.include_vars:
    file: "{{ transiciones_file }}"
    name: _dc_contrato

- name: Seleccionar la transicion
  vars:
    _dc_candidatas: >-
      {{ _dc_contrato.transiciones
         | selectattr('operacion', 'eq', operacion)
         | selectattr('aplica_a', 'contains', pareja) | list }}
  ansible.builtin.set_fact:
    _dc_t: "{{ _dc_candidatas | first | default({}, true) }}"

- name: Detener si no hay transicion definida
  ansible.builtin.fail:
    msg: |
      {{ _dc_contrato.politica_estado_desconocido.mensaje }}
      operacion={{ operacion }} pareja={{ pareja }} activo={{ kafka_estado.activo | default('?') }}
  when: _dc_t | length == 0

# El sitio activo se deduce del MirrorMaker encendido. Si ese MirrorMaker vive
# en un sitio que no responde queda DESCONOCIDO y no hay activo deducible: de
# ahi en adelante todo se derivaria de un valor vacio. Se detiene con el
# mensaje del contrato, no con un error de variable indefinida.
- name: Detener si no se pudo establecer el sitio activo
  vars:
    _dc_mms: >-
      {{ kafka_estado.mirrormakers | dict2items
         | map(attribute='key') | zip(kafka_estado.mirrormakers | dict2items
         | map(attribute='value.estado')) | map('join', '=') | list }}
  ansible.builtin.fail:
    msg: |
      {{ _dc_contrato.politica_estado_desconocido.mensaje }}
      No se pudo establecer cual es el sitio activo de la pareja {{ pareja }}.
      sitios que no responden: {{ kafka_estado.sitios_caidos | join(', ') | default('ninguno', true) }}
      replicaciones: {{ _dc_mms | join('  ') }}
  when:
    - modo == 'proponer'
    - kafka_estado.activo | length == 0

- name: Resolver sitios y MirrorMakers desde el estado actual
  ansible.builtin.set_fact:
    _dc_sa: "{{ kafka_estado.activo }}"
    _dc_sb: "{{ kafka_estado.pasivo }}"
    _dc_mm_hacia_b: "{{ kafka_estado.activo }}_{{ kafka_estado.pasivo }}"
    _dc_mm_hacia_a: "{{ kafka_estado.pasivo }}_{{ kafka_estado.activo }}"
  when: modo == 'proponer'

# La direccion declara el destino, no la maniobra. Se valida antes de
# interpretarla: sin esto una direccion ausente se leeria como "hay que
# ejecutar" y el operador nunca declaro nada.
- name: Validar la direccion declarada
  vars:
    _dc_origen: "{{ direccion | default('') | split('_a_') | first }}"
    _dc_destino: "{{ direccion | default('') | split('_a_') | last }}"
  ansible.builtin.assert:
    that:
      - direccion | default('') | length > 0
      - _dc_origen in parejas[pareja].sitios
      - _dc_destino in parejas[pareja].sitios
      - _dc_origen != _dc_destino
    fail_msg: >-
      Direccion '{{ direccion | default('(ninguna)') }}' no valida para la pareja
      {{ pareja }}. Se espera origen_a_destino con los sitios
      {{ parejas[pareja].sitios.keys() | list | join(', ') }}.
    quiet: true
  when: modo == 'proponer'

# Si el destino pedido ya es el sitio activo, el operador ya esta donde pidio
# estar: la operacion no tiene nada que hacer. No es un error del operador.
- name: Determinar si ya se esta en la direccion solicitada
  ansible.builtin.set_fact:
    _dc_nada_que_hacer: >-
      {{ (direccion | split('_a_') | last) == kafka_estado.activo }}
  when: modo == 'proponer'

# Estar en el destino no alcanza para declarar la operacion completada: el
# sitio correcto puede estar activo con la replicacion o el trafico a medio
# camino. Un estado incoherente necesita una persona, no un no-op.
- name: Detener si ya se esta en el destino pero el estado no es coherente
  vars:
    _dc_activas: >-
      {{ kafka_estado.mirrormakers | dict2items
         | selectattr('value.estado', 'eq', 'ACTIVO') | map(attribute='key') | list }}
  ansible.builtin.fail:
    msg: |
      El destino solicitado ({{ kafka_estado.activo }}) ya es el sitio activo,
      pero el estado no es coherente: no se puede declarar la operacion
      completada ni ejecutar nada. Revisar antes de reintentar.
      sitios caidos: {{ kafka_estado.sitios_caidos | join(', ') | default('ninguno', true) }}
      destinos de proxy que no resuelven: {{ kafka_estado.proxy_destinos_rotos | join(', ') | default('ninguno', true) }}
      replicaciones activas: {{ _dc_activas | join(', ') | default('ninguna', true) }}
  when:
    - modo == 'proponer'
    - _dc_nada_que_hacer | bool
    - not (kafka_estado.coherente | bool)

# En verificar los sitios salen del plan, no del estado nuevo: despues del
# failover el activo cambio y re-derivarlos invertiria la expectativa.
- name: Recuperar sitios del plan aprobado
  ansible.builtin.set_fact:
    _dc_sa: "{{ kafka_plan.sitio_a }}"
    _dc_sb: "{{ kafka_plan.sitio_b }}"
    _dc_mm_hacia_b: "{{ kafka_plan.mm_hacia_b }}"
    _dc_mm_hacia_a: "{{ kafka_plan.mm_hacia_a }}"
  when: modo == 'verificar'

- name: Detener si falta el plan para verificar
  ansible.builtin.fail:
    msg: "modo=verificar requiere kafka_plan (lo produce kafka_decide en modo proponer)"
  when:
    - modo == 'verificar'
    - kafka_plan is not defined

- name: Detener si el estado actual no es el de partida
  ansible.builtin.fail:
    msg: |
      {{ _dc_contrato.politica_estado_desconocido.mensaje }}
      {{ _dc_mm_hacia_b }}  esperado={{ _dc_t.desde.mirrormakers.hacia_b }}
         encontrado={{ kafka_estado.mirrormakers[_dc_mm_hacia_b].estado }}
      {{ _dc_mm_hacia_a }}  esperado={{ _dc_t.desde.mirrormakers.hacia_a }}
         encontrado={{ kafka_estado.mirrormakers[_dc_mm_hacia_a].estado }}
  when:
    - modo == 'proponer'
    - not _dc_nada_que_hacer | bool
    - kafka_estado.mirrormakers[_dc_mm_hacia_b].estado != _dc_t.desde.mirrormakers.hacia_b
      or kafka_estado.mirrormakers[_dc_mm_hacia_a].estado != _dc_t.desde.mirrormakers.hacia_a

- name: Ejecutar prechecks
  ansible.builtin.include_tasks: prechecks.yml
  when:
    - modo == 'proponer'
    - not _dc_nada_que_hacer | bool

- name: Armar el plan
  ansible.builtin.set_fact:
    kafka_plan:
      transicion: "{{ 'SIN_CAMBIOS' if _dc_nada_que_hacer | bool else _dc_t.id }}"
      nada_que_hacer: "{{ _dc_nada_que_hacer }}"
      direccion: "{{ direccion }}"
      operacion: "{{ operacion }}"
      pareja: "{{ pareja }}"
      sitio_a: "{{ _dc_sa }}"
      sitio_b: "{{ _dc_sb }}"
      mm_hacia_b: "{{ _dc_mm_hacia_b }}"
      mm_hacia_a: "{{ _dc_mm_hacia_a }}"
      acciones: "{{ [] if _dc_nada_que_hacer | bool else _dc_t.acciones }}"
      # Fotografia de los datos al decidir, para contrastar al terminar.
      datos_previos:
        offsets: "{{ kafka_estado.replicacion.offsets[_dc_sa] | default({}) }}"
        grupos: "{{ kafka_estado.replicacion.grupos[_dc_sa] | default({}) }}"
  when: modo == 'proponer'

# wf_kafka_plan viaja al siguiente Job Template del workflow. El failover lo
# compara contra el plan que recalcula, para no ejecutar algo distinto de lo
# que el operador aprobo.
- name: Publicar el plan como artifact del workflow
  ansible.builtin.set_stats:
    data:
      wf_kafka_plan: "{{ kafka_plan }}"
  when: modo == 'proponer'

- name: Mostrar la propuesta
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'propuesta.j2').split('\n') }}"
  when: modo == 'proponer'

- name: Verificar el estado final
  ansible.builtin.include_tasks: verificar.yml
  when: modo == 'verificar'
