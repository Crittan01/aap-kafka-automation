---
# Cada precheck corre solo si la transicion lo nombra. La seleccion vive en
# transitions.yml; la implementacion, aca.

- name: Precheck sitio destino alcanzable
  ansible.builtin.assert:
    that: kafka_estado.sitios[_dc_sb].alcanzable | bool
    fail_msg: "El sitio destino {{ _dc_sb }} no responde"
    success_msg: "sitio {{ _dc_sb }} alcanzable"
  when: "'sitio_b_alcanzable' in _dc_t.prechecks"

- name: Precheck Kafka destino listo
  ansible.builtin.assert:
    that: kafka_estado.sitios[_dc_sb].kafka_ready | bool
    fail_msg: "El Kafka de {{ _dc_sb }} no esta Ready"
    success_msg: "Kafka de {{ _dc_sb }} Ready"
  when: "'sitio_b_kafka_ready' in _dc_t.prechecks"

- name: Precheck sin particiones sub-replicadas en destino
  ansible.builtin.assert:
    that: not (kafka_estado.replicacion.under_replicated[_dc_sb] | default(false) | bool)
    fail_msg: "El Kafka de {{ _dc_sb }} tiene particiones sub-replicadas"
    success_msg: "sin particiones sub-replicadas en {{ _dc_sb }}"
  when:
    - "'sitio_b_sin_under_replicated' in _dc_t.prechecks"
    - umbrales.exigir_sin_under_replicated | bool

# Atraso por particion entre el activo y el pasivo, contra lag_maximo_mensajes.
- name: Fijar los offsets de ambos sitios
  ansible.builtin.set_fact:
    _dc_oa: "{{ kafka_estado.replicacion.offsets[_dc_sa] | default({}) }}"
    _dc_ob: "{{ kafka_estado.replicacion.offsets[_dc_sb] | default({}) }}"
    _dc_atraso: {}
  when: "'replicacion_al_dia' in _dc_t.prechecks"

- name: Calcular el atraso por particion
  ansible.builtin.set_fact:
    _dc_atraso: >-
      {{ _dc_atraso | combine({item.key:
         ((item.value | int) - (_dc_ob[item.key] | default(0) | int)) | abs}) }}
  loop: "{{ _dc_oa | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: "'replicacion_al_dia' in _dc_t.prechecks"

- name: Precheck replicacion al dia
  vars:
    _dc_atraso_max: "{{ _dc_atraso.values() | map('int') | list | max | default(0) }}"
  ansible.builtin.assert:
    that:
      - kafka_estado.replicacion.medida | bool
      - _dc_atraso_max | int <= umbrales.lag_maximo_mensajes | int
    fail_msg: >-
      Atraso de {{ _dc_atraso_max }} mensajes, supera el maximo de
      {{ umbrales.lag_maximo_mensajes }}.
      {{ _dc_sa }}={{ kafka_estado.replicacion.offsets[_dc_sa] | default('?') }}
      {{ _dc_sb }}={{ kafka_estado.replicacion.offsets[_dc_sb] | default('?') }}
    success_msg: "replicacion al dia (atraso {{ _dc_atraso_max }} <= {{ umbrales.lag_maximo_mensajes }})"
  when: "'replicacion_al_dia' in _dc_t.prechecks"

# Los mensajes pueden estar replicados y la posicion de los consumidores no:
# son dos flujos distintos. Sin este control el sitio que asume reprocesa.
- name: Precheck consumidores al dia
  vars:
    _dc_ga: "{{ kafka_estado.replicacion.grupos[_dc_sa] | default({}) }}"
    _dc_gb: "{{ kafka_estado.replicacion.grupos[_dc_sb] | default({}) }}"
    _dc_desfasados: >-
      {{ _dc_ga | dict2items
         | rejectattr('key', 'in', _dc_gb.keys() | list) | map(attribute='key') | list }}
  ansible.builtin.assert:
    that:
      - kafka_estado.replicacion.medida | bool
      - _dc_desfasados | length == 0
    fail_msg: >-
      Sin marcadores medidos en {{ _dc_sa }}, o grupos de consumo sin posicion
      replicada en {{ _dc_sb }}: {{ _dc_desfasados | join(', ') }}
    success_msg: "todos los grupos tienen posicion en {{ _dc_sb }}"
  when: "'consumidores_al_dia' in _dc_t.prechecks"

- name: Precheck posicion de cada grupo al dia
  ansible.builtin.assert:
    that:
      - (kafka_estado.replicacion.grupos[_dc_sb][item.key] | default(-1) | int) >= (item.value | int)
    fail_msg: >-
      La posicion de {{ item.key }} no esta al dia en {{ _dc_sb }}:
      {{ _dc_sa }}={{ item.value }}, {{ _dc_sb }}={{ kafka_estado.replicacion.grupos[_dc_sb][item.key] | default('ausente') }}.
      El sitio que asume reprocesaria mensajes.
    success_msg: "{{ item.key }}: posicion {{ item.value }} replicada"
  loop: "{{ kafka_estado.replicacion.grupos[_dc_sa] | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: "'consumidores_al_dia' in _dc_t.prechecks"

- name: Precheck destino del proxy resuelve
  ansible.builtin.assert:
    that: parejas[pareja].proxy[_dc_sa].destinos[_dc_sb] not in kafka_estado.sitios[_dc_sa].proxy_destinos_rotos
    fail_msg: >-
      El KafkaService {{ parejas[pareja].proxy[_dc_sa].destinos[_dc_sb] }} del proxy de {{ _dc_sa }}
      no resuelve. La operacion fallaria al conmutar el trafico.
    success_msg: "destino del proxy {{ parejas[pareja].proxy[_dc_sa].destinos[_dc_sb] }} resuelve"
  when: "'proxy_destino_b_resuelve' in _dc_t.prechecks"
