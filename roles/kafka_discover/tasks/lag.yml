---
# Offsets, marcadores de los grupos de consumo y particiones sub-replicadas.
# No existen como recurso de OpenShift: se consultan corriendo los CLI de
# Kafka dentro de un broker.
#
# Las tres consultas van en una sola invocacion, y ninguna recorre el
# inventario: kafka-get-offsets acepta una expresion regular de topicos y
# kafka-consumer-groups acepta --group repetido. Asi se abre un canal hacia el
# pod por sitio, en vez de uno por topico mas uno por grupo mas uno.
#
# Esto NO es mas rapido hoy. Cada CLI arranca su propia JVM y eso domina: la
# misma invocacion repetida en el broker de CO midio entre 20s y 36s, mientras
# que abrir el canal cuesta unos 4s. Con un topico y un grupo la diferencia
# queda sepultada bajo esa varianza. Lo que se gana es que el costo deje de
# crecer con el inventario: con los topicos y grupos reales de BPD serian N
# mas M mas una invocaciones por sitio, y el failover descubre dos veces.
#
# La regex va anclada y con los nombres escapados: selecciona exactamente los
# topicos declarados. Un comodin traeria los internos de Kafka y los de
# MirrorMaker, que no son de la aplicacion: en el lab son 7 de 8 topicos.

- name: Consultar offsets, marcadores y replicacion en {{ _kd_s }}
  vars:
    _kd_re_top: >-
      ^({{ _kd_p.topicos_aplicacion | map('regex_escape') | join('|') }})$
    _kd_arg_grp: >-
      {{ _kd_p.grupos_consumo | default([])
         | map('regex_replace', '^(.*)$', '--group \1') | join(' ') }}
  kubernetes.core.k8s_exec:
    namespace: "{{ _kd_cfg.namespace }}"
    pod: "{{ _kd_broker }}"
    container: kafka
    # El separador delimita las tres salidas. Distinguirlas por su forma
    # funcionaria hoy, pero depende de que ningun CLI cambie su formato.
    command: >-
      bash -c "bin/kafka-get-offsets.sh --bootstrap-server localhost:9092
      --topic '{{ _kd_re_top | trim }}'; echo ===kdr===;
      bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092
      --describe {{ _kd_arg_grp | trim }}; echo ===kdr===;
      bin/kafka-topics.sh --bootstrap-server localhost:9092
      --describe --under-replicated-partitions"
    host: "{{ _kd_cfg.api }}"
    api_key: "{{ kafka_tokens[_kd_s] }}"
    validate_certs: "{{ kafka_validate_certs }}"
  register: _kd_r_lag
  failed_when: false
  changed_when: false

# Sin las tres secciones la invocacion no llego a completarse y lo que haya
# llegado no se puede atribuir. Se dejan vacias: los offsets quedan sin tomar
# y los prechecks, que exigen replicacion.medida, se detienen.
- name: Separar las tres salidas de {{ _kd_s }}
  vars:
    _kd_partes: "{{ (_kd_r_lag.stdout | default('')).split('===kdr===') }}"
  ansible.builtin.set_fact:
    _kd_sec: "{{ _kd_partes if _kd_partes | length == 3 else ['', '', ''] }}"

- name: Extraer los marcadores de los grupos de consumo en {{ _kd_s }}
  vars:
    # cada linea: "grupo topico particion marcador fin lag ..."
    _kd_patron: '([a-z0-9][a-z0-9-]+) +([a-z0-9][a-z0-9.-]+) +([0-9]+) +([0-9]+) +[0-9]+ +[0-9-]+'
  ansible.builtin.set_fact:
    _kd_marcadores: "{{ _kd_sec[1] | regex_findall(_kd_patron) }}"

# Se escribe directo en el dict del sitio: un acumulador intermedio se
# arrastraria al siguiente sitio del recorrido.
- name: Consolidar marcadores de {{ _kd_s }}
  ansible.builtin.set_fact:
    _kd_grupos: >-
      {{ _kd_grupos | default({}) | combine({_kd_s:
         (_kd_grupos[_kd_s] | default({}))
         | combine({item[0] ~ '|' ~ item[1] ~ ':' ~ item[2]: item[3] | int})}) }}
  loop: "{{ _kd_marcadores }}"
  loop_control:
    label: "{{ item[0] }} {{ item[1] }}:{{ item[2] }}"

- name: Consolidar offsets de {{ _kd_s }}
  vars:
    # kafka-get-offsets devuelve lineas "topico:particion:offset". Se extraen
    # los pares con una sola expresion, para no depender de como venga el
    # salto de linea.
    _kd_pares: "{{ _kd_sec[0] | regex_findall('([^ :\n]+:[0-9]+):([0-9]+)') }}"
  ansible.builtin.set_fact:
    _kd_offsets: "{{ _kd_offsets | default({}) | combine({_kd_s: dict(_kd_pares)}) }}"
    _kd_urp: >-
      {{ _kd_urp | default({}) | combine({_kd_s:
         (_kd_sec[2] | trim | length) > 0}) }}
