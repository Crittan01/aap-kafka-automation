---
# Offsets y particiones sub-replicadas via Admin API de Kafka.
# No existen como recurso de OpenShift: se consultan ejecutando en un broker.

- name: Consultar offsets en {{ _kd_s }}
  kubernetes.core.k8s_exec:
    namespace: "{{ _kd_cfg.namespace }}"
    pod: "{{ _kd_cfg.broker_pod }}"
    container: kafka
    command: >-
      bin/kafka-get-offsets.sh --bootstrap-server localhost:9092
      --topic {{ item }}
    host: "{{ _kd_cfg.api }}"
    api_key: "{{ kafka_tokens[_kd_s] }}"
    validate_certs: "{{ kafka_validate_certs }}"
  loop: "{{ _kd_p.topicos_aplicacion }}"
  register: _kd_r_off
  failed_when: false
  changed_when: false

- name: Consultar particiones sub-replicadas en {{ _kd_s }}
  kubernetes.core.k8s_exec:
    namespace: "{{ _kd_cfg.namespace }}"
    pod: "{{ _kd_cfg.broker_pod }}"
    container: kafka
    command: >-
      bin/kafka-topics.sh --bootstrap-server localhost:9092
      --describe --under-replicated-partitions
    host: "{{ _kd_cfg.api }}"
    api_key: "{{ kafka_tokens[_kd_s] }}"
    validate_certs: "{{ kafka_validate_certs }}"
  register: _kd_r_urp
  failed_when: false
  changed_when: false

- name: Consolidar offsets de {{ _kd_s }}
  vars:
    # kafka-get-offsets devuelve lineas "topico:particion:offset"
    _kd_lineas: >-
      {{ _kd_r_off.results | map(attribute='stdout', default='')
         | map('split', '\n') | sum(start=[]) | select('search', ':') | list }}
  ansible.builtin.set_fact:
    _kd_offsets: >-
      {{ _kd_offsets | default({}) | combine({_kd_s:
         dict(_kd_lineas | map('regex_replace', '^([^:]+:[^:]+):.*$', '\1') | list
              | zip(_kd_lineas | map('regex_replace', '^.*:', '') | map('int') | list)) }) }}
    _kd_urp: >-
      {{ _kd_urp | default({}) | combine({_kd_s:
         (_kd_r_urp.stdout | default('') | trim | length) > 0}) }}
