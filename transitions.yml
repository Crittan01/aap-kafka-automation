---
# Contrato de transiciones permitidas. Toda combinacion ausente es HARD STOP.
# sitio_a = activo actual (descubierto); sitio_b = el otro.
#
# Agregar una operacion es agregar un bloque aca. Ningun rol bifurca por el
# nombre de la operacion: kafka_decide elige la transicion por 'operacion' mas
# 'aplica_a', y los roles ejecutan las acciones que el plan les deja.

version: 2

transiciones:

  # El failover tal como lo define la seccion 1.2 del procedimiento operativo
  # de BPD: "hacer un switch entre un sitio operativo (CO) a un sitio alterno
  # (CA) de forma segura", y "se puede realizar en cualquier momento". El
  # "CO falla de forma inesperada" de la seccion 2.1 es un escenario de uso,
  # no la definicion: el OFF de su tabla es consecuencia de que CO no este.
  #
  # Esta transicion exige los dos sitios alcanzables, porque cuatro de sus
  # seis acciones escriben en el sitio que deja de ser activo. La variante con
  # el sitio activo realmente caido es otra transicion, con otro estado final,
  # y espera decisiones de BPD sobre RPO y sobre con que mecanismo se conmuta
  # el trafico si el proxy a conmutar vive en el sitio caido.
  - id: FAILOVER
    descripcion: Switch seguro de la operacion al otro sitio, con los dos sanos.
    operacion: failover
    aplica_a:
      - core

    # El destino de los proxies no es condicion de partida: la operacion los
    # lleva a los dos al sitio activo, asi que corrige el que venga torcido.
    desde:
      activo: sitio_a
      mirrormakers:
        hacia_b: ACTIVO
        hacia_a: PASIVO

    prechecks:
      - sitio_b_kafka_ready
      - sitio_b_sin_under_replicated
      - replicacion_al_dia
      - consumidores_al_dia
      - proxy_destino_b_resuelve
      - sitio_b_alcanzable

    # El orden importa: primero se apaga la replicacion para no dejar un loop,
    # despues se mueve el trafico, y al final se escalan las aplicaciones.
    acciones:
      - rol: mm2_state
        sentido: hacia_b
        estado: PASIVO
      - rol: mm2_state
        sentido: hacia_a
        estado: ACTIVO
      # Los dos proxies quedan apuntando al sitio activo. El resumen de URLs
      # de la seccion 5.2 lo declara asi para cada escenario -- para Failover
      # CORE, el Kafka de CA -- y el paso 4 de la seccion 2.3.2 es justamente
      # devolver el proxy del sitio que vuelve a ser activo.
      - rol: proxy_target
        sitio: sitio_a
        destino: sitio_b
      - rol: proxy_target
        sitio: sitio_b
        destino: sitio_b
      - rol: app_scale
        sitio: sitio_a
        estado: pasivo
      - rol: app_scale
        sitio: sitio_b
        estado: activo

    gates:
      - momento: antes_de_switch_trafico
        muestra:
          - estado_actual
          - acciones
          - estado_esperado
          - resultado_prechecks

    hasta:
      activo: sitio_b
      mirrormakers:
        hacia_b: PASIVO
        hacia_a: ACTIVO
      # Los dos, no solo el del sitio que sale.
      proxy_destino: sitio_b

politica_estado_desconocido:
  accion: HARD_STOP
  mensaje: >-
    El estado descubierto no corresponde a ninguna transicion permitida.
    El workflow se detiene sin interpretar ni corregir.
